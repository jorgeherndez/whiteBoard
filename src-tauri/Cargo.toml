[package]
name = "whiteboard"
version = "0.2.2"
description = "Pizarra blanca personal"
edition = "2021"

[lib]
name = "whiteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
